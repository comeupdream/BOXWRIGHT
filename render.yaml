# Render Blueprint — ONE static site that serves both Boxwright and Experience India.
#
#   Render → New → Blueprint → pick this repo and branch → Apply.
#   Boxwright is served at /, Experience India at /experience-india/.
#   Every push to the branch rebuilds and redeploys.
#
# Experience India's forms need an endpoint in experience-india/site.config.json
# (forms.*Action: Formspree, Basin or a Google Apps Script URL) — Render has no form handling.
services:
  - type: web
    name: boxwright-studio
    runtime: static
    buildCommand: node build.mjs
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /experience-india/assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
