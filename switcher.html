<!-- Build-time site switcher (see build.mjs). Not part of either site's source. -->
<nav class="site-switch" aria-label="Sites" style="background:#14120f;color:#cfc7b8;font:600 12px/1 system-ui,sans-serif;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:4px;align-items:center;padding:0 max(16px,env(safe-area-inset-left,0px));height:34px;overflow-x:auto">
  <span style="opacity:.55;margin-right:10px">Sites</span>
  <a href="/" data-site="boxwright" style="color:inherit;text-decoration:none;padding:9px 12px;border-radius:999px;white-space:nowrap">Boxwright</a>
  <a href="/experience-india/" data-site="experience-india" style="color:inherit;text-decoration:none;padding:9px 12px;border-radius:999px;white-space:nowrap">Experience India</a>
  <style>.site-switch a[aria-current="page"]{background:#2b2722;color:#fff}.site-switch a:hover{color:#fff}</style>
  <script>(function(){var k=location.pathname.indexOf("/experience-india")===0?"experience-india":"boxwright";var a=document.querySelector('.site-switch a[data-site="'+k+'"]');if(a)a.setAttribute("aria-current","page");})()</script>
</nav>
